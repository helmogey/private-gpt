# The default configuration file.
# More information about configuration can be found in the documentation: https://docs.privategpt.dev/
# Syntax in `private_pgt/settings/settings.py`
server:
  env_name: ${APP_ENV:prod}
  port: ${PORT:8001}
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]
  auth:
    enabled: false
    secret: "Basic c2VjcmV0OmtleQ=="

data:
  local_ingestion:
    enabled: ${LOCAL_INGESTION_ENABLED:false}
    allow_ingest_from: ["*"]
  local_data_folder: local_data/private_gpt

ui:
  enabled: true
  path: "/" 
  default_mode: "RAG"
  default_query_system_prompt: >
    You are an intelligent, helpful AI assistant.
    If you are provided with document context, use it to accurately answer the user's question.
    If you have access to external tools (like the Zabbix API), you MUST use them to fetch real-time information to solve the user's request.
    If the answer is not available in the context and cannot be found using your tools, simply state that you do not have the information. Do not hallucinate or make up data.
  delete_file_button_enabled: true
  delete_all_files_button_enabled: true

llm:
  mode: ${LLM_MODE:ollama}
  prompt_style: "llama3"
  max_new_tokens: 1024
  context_window: 8192
  temperature: 0.1
  n_gpu_layers: -1

rag:
  similarity_top_k: 20
  # FIXED: Set to 512.
  # With an 8192 context window, 512 is very safe. 
  # If 256 failed previously, the issue was likely the Model's context limit (2048) 
  # rejecting a chunk, or the num_ctx setting wasn't applying. 
  # Raising num_ctx to 8192 should resolve this.
  chunk_size: 150
  chunk_overlap: 20
  rerank:
    enabled: True
    model: cross-encoder/ms-marco-MiniLM-L-2-v2
    top_n: 5

summarize:
  use_async: true

clickhouse:
    host: localhost
    port: 8443
    username: admin
    password: clickhouse
    database: embeddings

# Kept for reference, but currently unused since mode is 'ollama'
llamacpp:
  llm_hf_repo_id: professorf/Meta-Llama-3-1-8B-Instruct-f16-gguf
  llm_hf_model_file: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
  tfs_z: 1.0
  top_k: 40
  top_p: 1.0
  repeat_penalty: 1.1
  n_gpu_layers: -1

embedding:
  mode: ollama
  ingest_mode: simple
  embed_dim: 768

huggingface:
  embedding_hf_model_name: nomic-ai/nomic-embed-text-v1.5
  access_token: ${HF_TOKEN:}
  trust_remote_code: true

vectorstore:
  database: qdrant

nodestore:
  database: simple

milvus:
  uri: local_data/private_gpt/milvus/milvus_local.db
  collection_name: milvus_db
  overwrite: false

qdrant:
  path: local_data/private_gpt/qdrant

postgres:
  host: localhost
  port: 5432
  database: postgres
  user: postgres
  password: postgres
  schema_name: private_gpt

sagemaker:
  llm_endpoint_name: huggingface-pytorch-tgi-inference-2023-09-25-19-53-32-140
  embedding_endpoint_name: huggingface-pytorch-inference-2023-11-03-07-41-36-479

openai:
  api_key: ${OPENAI_API_KEY:}
  model: gpt-3.5-turbo
  embedding_api_key: ${OPENAI_API_KEY:}

ollama:
  llm_model: ${OLLAMA_MODEL:llama3.1}
  embedding_model: nomic-embed-text
  api_base: ${OLLAMA_API_BASE:http://127.0.0.1:11434}
  embedding_api_base: ${OLLAMA_API_BASE:http://127.0.0.1:11434}
  keep_alive: 5m
  request_timeout: 1800.0
  autopull_models: true
  options:
    num_ctx: 8192

azopenai:
  api_key: ${AZ_OPENAI_API_KEY:}
  azure_endpoint: ${AZ_OPENAI_ENDPOINT:}
  embedding_deployment_name: ${AZ_OPENAI_EMBEDDING_DEPLOYMENT_NAME:}
  llm_deployment_name: ${AZ_OPENAI_LLM_DEPLOYMENT_NAME:}
  api_version: "2023-05-15"
  embedding_model: text-embedding-ada-002
  llm_model: gpt-35-turbo

gemini:
  api_key: ${GOOGLE_API_KEY:}
  model: ${GEMINI_MODEL:models/gemini-pro}
  embedding_model: models/embedding-001

