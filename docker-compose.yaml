services:
  private-gpt-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: private-gpt-gpu:latest
    
    ports:
      - "8001:8001"

    # Allow container to reach host (Ollama) via host.docker.internal
    # (Kept for reference, but we are using IP directly below)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./local_data:/home/worker/app/local_data
      # CHANGED: Mount the settings.yaml file so changes take effect!
      - ./settings.yaml:/home/worker/app/settings.yaml

    environment:
      PORT: 8001
      # CRITICAL FIX: Commented out the 'docker' profile.
      # This prevents the built-in 'settings-docker.yaml' from overriding 
      # our custom settings (like context window) and causing the crash.
      # PGPT_PROFILES: docker
      
      PGPT_MODE: ollama
      PGPT_EMBED_MODE: ollama
      
      # FIXED: Use IP directly to bypass DNS resolution failure [Errno -3]
      # 172.17.0.1 is the standard host gateway IP on Linux Docker
      PGPT_OLLAMA__API_BASE: http://172.17.0.1:11434
      PGPT_OLLAMA__EMBEDDING_API_BASE: http://172.17.0.1:11434
      
      # FIXED: Force critical settings via Env Vars to bypass file profile conflicts
      
      # 1. Force chunk size to 256 (Ultra-safe for 2048 context limit)
      PGPT_RAG__CHUNK_SIZE: 256
      # 2. Force chunk overlap
      PGPT_RAG__CHUNK_OVERLAP: 20
      
      # 3. Force Ollama context limit to 2048 (Matches n_ctx_train hard limit)
      PGPT_OLLAMA__OPTIONS__NUM_CTX: 2048
      
      # 4. Sync LLM context window to avoid mismatches
      PGPT_LLM__CONTEXT_WINDOW: 2048
      
    # GPU Access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
